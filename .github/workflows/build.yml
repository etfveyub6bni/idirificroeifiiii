name: Windows DLL Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install 7-Zip
      run: |
        choco install 7zip --no-progress -y

    - name: Extract RAR Archive
      run: |
        & "C:\Program Files\7-Zip\7z.exe" x "Архив WinRAR.rar" -o"project_files" -y

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Automatically Find and Build Solution
      run: |
        $slnFile = Get-ChildItem -Path "project_files" -Filter "*.sln" -Recurse | Select-Object -First 1
        if ($slnFile) {
            Write-Output "Found solution at: $($slnFile.FullName)"
            msbuild $($slnFile.FullName) /p:Configuration=Release /p:Platform=x64
        } else {
            Write-Error "Solution file (.sln) not found anywhere in the extracted archive!"
            exit 1
        }

    - name: Find and Upload Finished DLL
      uses: actions/upload-artifact@v4
      with:
        name: hack-dll
        path: project_files/**/Release/*.dll
