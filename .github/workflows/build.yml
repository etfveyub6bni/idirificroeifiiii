name: Windows DLL Build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Chocolatey and 7-Zip
      run: |
        choco install 7zip --no-progress -y

    - name: Extract RAR Archive
      run: |
        & "C:\Program Files\7-Zip\7z.exe" x "Архив WinRAR.rar" -o"project_files" -y

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      run: |
        cd project_files/Goose-Goose-Duck-ImGui-main/user
        msbuild IL2CppDLL.sln /p:Configuration=Release /p:Platform=x64

    - name: Upload Finished DLL
      uses: actions/upload-artifact@v4
      with:
        name: hack-dll
        path: project_files/Goose-Goose-Duck-ImGui-main/user/x64/Release/*.dll
